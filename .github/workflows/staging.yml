name: Build & Deploy (Auth Staging)

on:
  push:
    branches: ["staging"]

env:
  IMAGE_NAME: nhutq/auth-service

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Login Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build & Push
      run: |
        docker build -t $IMAGE_NAME:${{ github.sha }} .
        docker push $IMAGE_NAME:${{ github.sha }}

    - name: Update GitOps repo
      run: |
        git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/tqnhu4/gitops-platform.git
        cd gitops-platform

        wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O yq
        chmod +x yq

        ./yq -i ".images[0].newTag = \"${{ github.sha }}\"" apps/auth/overlays/staging/kustomization.yaml

        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add .
        git commit -m "Update auth dev image to ${{ github.sha }}" || echo "No changes"
        git push